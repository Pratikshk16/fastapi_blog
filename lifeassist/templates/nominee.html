<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trusted contacts</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fb}.box{max-width:900px;margin:40px auto}.cardx{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:24px}.nom{border:1px solid #e7ebf1;border-radius:14px;padding:15px;margin:10px 0}</style></head><body><div class="box"><a href="/app">← Back to LifeAssist</a><div class="cardx mt-3"><h1>Trusted family member</h1><p class="text-secondary">For the prototype, verification is a safe demo switch. In the full product, the nominee would verify independently.</p><form id="f"><div class="row g-2"><div class="col-md-6"><input id="n" class="form-control" placeholder="Name" required></div><div class="col-md-6"><input id="e" class="form-control" placeholder="Email" type="email" required></div><div class="col-md-6"><input id="p" class="form-control" placeholder="Phone" required></div><div class="col-md-6"><input id="r" class="form-control" placeholder="Relation" value="Child"></div></div><button class="btn btn-primary mt-3">Add trusted contact</button></form><div id="list" class="mt-4"></div></div></div><script>const t=localStorage.token;if(!t)location='/login';async function api(u,o={}){o.headers=Object.assign({'Authorization':'Bearer '+t},o.headers||{});return fetch(u,o)}async function load(){let j=await(await api('/api/nominees')).json();list.innerHTML=j.map(x=>'<div class="nom"><strong>'+x.name+'</strong> · '+x.relation+' · '+x.phone+'<div class="text-secondary">'+x.email+'</div><div class="mt-2">Status: '+(x.approved?'Verified':'Not verified')+(x.approved?'':' <button class="btn btn-sm btn-success" onclick="verify('+x.id+')">Verify demo</button>')+'</div></div>').join('')||'<div class="text-secondary">No trusted contacts yet.</div>'}f.onsubmit=async(ev)=>{ev.preventDefault();let r=await api('/api/nominees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,email:e.value,phone:p.value,relation:r.value})});await r.json();f.reset();load()}async function verify(id){await api('/api/nominees/'+id+'/verify',{method:'POST'});load()}load()</script></body></html>
