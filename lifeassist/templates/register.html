<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeAssist Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fb}.box{max-width:560px;margin:60px auto;background:#fff;padding:36px;border:1px solid #e6eaf0;border-radius:20px}</style></head><body><div class="box"><h1>Create your LifeAssist account</h1><p class="text-secondary">You control your information and trusted contacts.</p><form id="f"><input id="u" class="form-control mb-3" placeholder="Your name" required><input id="e" type="email" class="form-control mb-3" placeholder="Email" required><input id="p" type="password" class="form-control mb-3" placeholder="Password (8+ characters)" minlength="8" required><button class="btn btn-primary btn-lg w-100">Create account</button></form><div id="m" class="mt-3"></div><p class="mt-4">Already have an account? <a href="/login">Sign in</a></p></div><script>f.onsubmit=async(ev)=>{ev.preventDefault();let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,email:e.value,password:p.value})});let j=await r.json();if(r.ok){localStorage.token=j.access_token;location='/app'}else{m.innerHTML='<div class="alert alert-danger">'+(j.detail||'Could not register')+'</div>'}}</script></body></html>
