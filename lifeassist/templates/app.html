<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeAssist Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fb}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center}.cardx{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:22px;height:100%}.big{font-size:1.15rem;padding:1rem}.mic{width:74px;height:74px;border-radius:50%;font-size:28px}.sos{background:#b42318;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.doc{border:1px solid #e5e9f0;border-radius:14px;padding:14px;margin-bottom:10px;background:#fafbfc}.assistant{height:320px;overflow:auto;background:#fbfcff;border:1px solid #e7ebf2;border-radius:14px;padding:16px}.bubble{padding:12px 15px;border-radius:14px;margin-bottom:10px;max-width:90%}.me{background:#e8f0ff;margin-left:auto}.ai{background:#fff;border:1px solid #e5e9f2}.smallcaps{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#667085}</style></head><body><div class="wrap"><div class="top mb-4"><div><div class="smallcaps">LifeAssist</div><h1 class="mb-0">Good morning. What can I help with?</h1><div id="user" class="text-secondary"></div></div><div class="d-flex gap-2"><a href="/nominee" class="btn btn-outline-primary">Trusted contacts</a><button class="sos" onclick="sos()">SOS</button></div></div><div class="row g-4"><div class="col-lg-5"><div class="cardx mb-4"><h3>1. Upload a document</h3><p class="text-secondary">Hospital bill, insurance policy, prescription or other paperwork.</p><input id="file" type="file" class="form-control big" accept=".pdf,.txt,image/*"><button onclick="upload()" class="btn btn-primary btn-lg mt-3">Understand this document</button><div id="uploadMsg" class="mt-3"></div></div><div class="cardx"><h3>Your documents</h3><div id="docs">Loading...</div></div></div><div class="col-lg-7"><div class="cardx"><div class="d-flex justify-content-between align-items-center"><div><div class="smallcaps">AI companion</div><h3 class="mb-0">Talk to LifeAssist</h3></div><button class="btn btn-outline-secondary mic" id="mic" onclick="listen()">🎙️</button></div><div id="chat" class="assistant mt-3"></div><div class="input-group mt-3"><input id="msg" class="form-control big" placeholder="e.g. Explain what this bill means"><button class="btn btn-primary btn-lg" onclick="send()">Ask</button></div><div class="mt-3"><select id="lang" class="form-select"><option>English</option><option>Hindi</option><option>Gujarati</option></select></div></div><div class="cardx mt-4"><h3>Pending actions</h3><div id="actions">Loading...</div></div></div></div></div><script>
const token=()=>localStorage.token;if(!token())location='/login';async function api(url,opt={}){opt.headers=Object.assign({'Authorization':'Bearer '+token()},opt.headers||{});return fetch(url,opt)}
async function load(){let me=await (await api('/api/me')).json();user.textContent='Signed in as '+me.username;let d=await (await api('/api/documents')).json();docs.innerHTML=d.length?d.map(x=>'<div class="doc"><strong>'+x.filename+'</strong><div class="text-secondary small">'+x.summary.replaceAll('\n','<br>')+'</div><button class="btn btn-sm btn-outline-primary mt-2" onclick="pick('+x.id+')">Ask about this</button></div>').join(''):'<div class="text-secondary">No documents yet.</div>';let a=await (await api('/api/actions')).json();actions.innerHTML=a.length?a.map(x=>'<div class="doc"><strong>'+x.action_type+'</strong> · '+x.status+'<div>'+x.description+'</div>'+(x.status==='USER_APPROVAL_REQUIRED'?'<button class="btn btn-success btn-sm mt-2" onclick="finalize('+x.id+')">Approve & complete</button>':'')+'</div>').join(''):'<div class="text-secondary">No actions yet.</div>'}function add(text,cls){chat.innerHTML+='<div class="bubble '+cls+'">'+text.replaceAll('\n','<br>')+'</div>';chat.scrollTop=chat.scrollHeight}async function send(){let text=msg.value.trim();if(!text)return;add(text,'me');msg.value='';let r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,language:lang.value})});let j=await r.json();add(j.answer||'I could not answer that.','ai')}function pick(id){window.selectedDoc=id;add('I am looking at document #'+id+'. Ask me what you want to know.','ai')}async function upload(){let f=file.files[0];if(!f)return;let fd=new FormData();fd.append('file',f);uploadMsg.innerHTML='<div class="text-secondary">Reading and analyzing...</div>';let r=await api('/api/documents',{method:'POST',body:fd});let j=await r.json();if(r.ok){uploadMsg.innerHTML='<div class="alert alert-success">Document analyzed.</div>';window.selectedDoc=j.id;add(j.summary,'ai');load()}else uploadMsg.innerHTML='<div class="alert alert-danger">'+(j.detail||'Upload failed')+'</div>'}msg.addEventListener('keydown',e=>{if(e.key==='Enter')send()});function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input is not supported in this browser. Try Chrome.');return}let r=new SR();r.lang=lang.value==='Hindi'?'hi-IN':lang.value==='Gujarati'?'gu-IN':'en-IN';r.onresult=e=>{msg.value=e.results[0][0].transcript;send()};r.start()}async function finalize(id){let r=await api('/api/actions/'+id+'/finalize',{method:'POST'});let j=await r.json();alert(j.message||j.detail);load()}async function sos(){let r=await api('/api/sos',{method:'POST'});let j=await r.json();alert(j.message||j.detail||'SOS triggered')}load()
</script></body></html>
