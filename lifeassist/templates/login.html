<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeAssist Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fb}.box{max-width:520px;margin:80px auto;background:#fff;padding:36px;border:1px solid #e6eaf0;border-radius:20px}input{font-size:1.1rem;padding:.85rem}</style></head><body><div class="box"><h1>Welcome back</h1><p class="text-secondary">Sign in to your LifeAssist demo.</p><form id="f"><label class="form-label">Email</label><input class="form-control mb-3" type="email" id="e" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" id="p" required><button class="btn btn-primary btn-lg w-100">Continue</button></form><div id="m" class="mt-3"></div><p class="mt-4 mb-0">New here? <a href="/register">Create an account</a></p></div><script>f.onsubmit=async(e)=>{e.preventDefault();let d=new URLSearchParams();d.set('username',e.value);d.set('password',p.value);let r=await fetch('/api/auth/token',{method:'POST',body:d});let j=await r.json();if(r.ok){localStorage.token=j.access_token;location='/app'}else{m.innerHTML='<div class="alert alert-danger">'+(j.detail||'Login failed')+'</div>'}}</script></body></html>
